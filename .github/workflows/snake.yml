name: snake
# Turns the contribution graph into the animated snake shown on the profile.
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#c3c6cb
            dist/snake-light.svg?color_snake=#57606a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: update snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
